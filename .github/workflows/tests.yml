name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3

      - name: Setup JS dependencies
        uses: ./.github/workflows/setup-pnpm
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Prepare catalog metadata and token images
        run: pnpm prepare:catalog

      - name: Check token image hashes
        run: pnpm check:assets

      - name: Check generated catalog
        run: pnpm check:catalog

      - name: Test catalog scripts
        run: python3 -m unittest discover -s scripts -p 'test_catalog*.py'

      - name: Run tests
        run: pnpm test:jest
