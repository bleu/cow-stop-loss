name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3

      - name: Setup JS dependencies
        uses: ./.github/workflows/setup-pnpm
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Test catalog scripts
        run: python3 -m unittest discover -s scripts -p 'test_catalog*.py'

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test:jest --runInBand

      - name: Lint
        run: pnpm lint

      - name: Build app and documentation
        run: pnpm build
