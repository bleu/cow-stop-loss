<svg xmlns="http://www.w3.org/2000/svg" id="still" width="1800" height="400" viewBox="0 0 1800 400" fill="none" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Pixel moon, drifting clouds, offset stars, and a rare comet</title>
  <style>
.cloud-drift { transform-origin: 0px 0px; animation: var(--scene-animation, cloud-drift 160s linear infinite alternate); }
.cloud-late { animation-duration: 210s; animation-delay: -73s; }
@keyframes cloud-drift { from { transform: translate(-10px, 0); } to { transform: translate(10px, 0); } }
.star { animation: var(--scene-animation, twinkle 17s ease-in-out infinite); }
.star-late { animation-delay: -7s; animation-duration: 23s; }
.star-field { transform-origin: 450px 100px; animation: var(--scene-animation, star-drift 180s linear infinite alternate); }
.star-field-late { animation-delay: -91s; animation-duration: 230s; }
.comet { transform-origin: 0px 0px; opacity: 0; animation: var(--scene-animation, comet 96s linear 3s infinite); }
@keyframes twinkle { 0%, 28%, 70%, 100% { opacity: .45; } 48% { opacity: .8; } }
@keyframes star-drift { from { transform: translate(-2px, 0); } to { transform: translate(3px, 1px); } }
@keyframes comet { 0% { opacity: 0; transform: translate(650px, 14px); } .15% { opacity: .65; } 2% { opacity: 0; transform: translate(690px, 29px); } 100% { opacity: 0; transform: translate(690px, 29px); } }

:root:target { --scene-animation: none; }
@media (prefers-reduced-motion: reduce) { :root { --scene-animation: none; } }
</style>
  <g transform="scale(2)">
    <defs>
      <g id="cloud">
        <path d="M0 19 4 19 4 15 10 15 10 11 17 11 17 7 23 7 23 2 29 2 29 0 38 0 38 3 43 3 43 7 47 7 47 13 53 13 53 10 59 10 59 13 64 13 64 18 69 18 69 21 76 21 76 24 0 24 0 19Z" fill="#192e5b" />
        <path d="M4 18 8 18 8 14 16 14 16 17 20 17 20 10 24 10 24 5 28 5 28 2 37 2 37 5 41 5 41 10 45 10 45 17 49 17 49 19 53 19 53 15 59 15 59 18 62 18 62 21 4 21 4 18Z" fill="#213a70" />
        <rect x="28" y="22" width="20" height="3" fill="#192e5b" />
      </g>
    </defs>
    <g class="star-field">
      <rect x="46" y="59" width="2" height="2" fill="#c0d9ff" class="star" opacity=".65" />
      <rect x="238" y="45" width="2" height="2" fill="#c0d9ff" opacity=".5" class="star" />
      <rect x="408" y="35" width="2" height="2" fill="#c0d9ff" opacity=".5" class="star" />
      <rect x="535" y="66" width="2" height="2" fill="#c0d9ff" class="star" opacity=".65" />
      <rect x="643" y="104" width="2" height="2" fill="#c0d9ff" opacity=".5" class="star" />
      <rect x="844" y="110" width="2" height="2" fill="#c0d9ff" opacity=".5" class="star" />
      <rect x="706" y="155" width="2" height="2" fill="#c0d9ff" class="star" opacity=".65" />
      <rect x="826" y="159" width="2" height="2" fill="#c0d9ff" opacity=".5" class="star" />
    </g>
    <g class="star-field star-field-late">
      <rect x="136" y="105" width="1" height="1" fill="#c0d9ff" opacity=".5" class="star star-late" />
      <rect x="343" y="67" width="1" height="1" fill="#c0d9ff" class="star star-late" opacity=".65" />
      <rect x="471" y="113" width="1" height="1" fill="#c0d9ff" opacity=".5" class="star star-late" />
      <rect x="611" y="45" width="1" height="1" fill="#c0d9ff" opacity=".5" class="star star-late" />
      <rect x="785" y="53" width="1" height="1" fill="#c0d9ff" class="star star-late" opacity=".65" />
      <rect x="878" y="29" width="1" height="1" fill="#c0d9ff" opacity=".5" class="star star-late" />
      <rect x="566" y="154" width="1" height="1" fill="#c0d9ff" opacity=".5" class="star star-late" />
    </g>
    <g transform="translate(714 8)">
      <path d="M7 0 17 0 17 1 21 1 21 4 24 4 24 8 25 8 25 17 24 17 24 21 21 21 21 24 17 24 17 25 7 25 7 24 3 24 3 21 1 21 1 17 0 17 0 8 1 8 1 4 4 4 4 1 7 1 7 0Z" fill="#f9efc5" />
      <rect x="7" y="3" width="8" height="2" fill="#fff9d9" />
      <rect x="3" y="8" width="3" height="8" fill="#fff9d9" />
      <rect x="16" y="6" width="4" height="3" fill="#e4d9a9" />
      <rect x="18" y="9" width="3" height="2" fill="#e4d9a9" />
      <rect x="8" y="10" width="3" height="4" fill="#e4d9a9" />
      <rect x="10" y="14" width="3" height="3" fill="#e4d9a9" />
      <rect x="16" y="18" width="4" height="3" fill="#e4d9a9" />
      <rect x="5" y="20" width="4" height="2" fill="#e4d9a9" />
    </g>
    <g class="cloud-drift">
      <use href="#cloud" x="628" y="125" />
    </g>
    <g class="cloud-drift cloud-late">
      <use href="#cloud" x="816" y="95" />
    </g>
    <g class="comet">
      <rect fill="#c0d9ff" x="0" y="0" width="3" height="2" opacity=".9" />
      <rect fill="#c0d9ff" x="-5" y="-2" width="5" height="1" opacity=".5" />
      <rect fill="#c0d9ff" x="-10" y="-4" width="5" height="1" opacity=".25" />
      <rect fill="#c0d9ff" x="-15" y="-6" width="5" height="1" opacity=".12" />
    </g>
  </g>
</svg>
