<svg xmlns="http://www.w3.org/2000/svg" id="still" width="1800" height="400" viewBox="0 0 1800 400" fill="none" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Pixel clouds with distant birds and an occasional plane</title>
  <style>
.cloud-drift { transform-origin: 0px 0px; animation: var(--scene-animation, cloud-drift 160s linear infinite alternate); }
.cloud-late { animation-duration: 210s; animation-delay: -73s; }
@keyframes cloud-drift { from { transform: translate(-10px, 0); } to { transform: translate(10px, 0); } }
.birds { transform-origin: 0px 0px; animation: var(--scene-animation, birds 96s linear 1.2s infinite backwards); }
.birds-late { animation-delay: 2.4s; animation-duration: 108s; }
.wings { transform-origin: 0px 0px; animation: var(--scene-animation, wings 4s steps(2, end) infinite); }
.plane { transform-origin: 0px 0px; opacity: 0; animation: var(--scene-animation, plane 120s linear 5s infinite); }
@keyframes birds { 0% { opacity: 0; transform: translate(-4px, 0); } .5%, 8% { opacity: 1; } 10% { opacity: 0; transform: translate(40px, -3px); } 100% { opacity: 0; transform: translate(40px, -3px); } }
@keyframes wings { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, 1px); } }
@keyframes plane { 0% { opacity: 0; transform: translate(650px, 22px); } .5%, 7.5% { opacity: .55; } 9% { opacity: 0; transform: translate(800px, 22px); } 100% { opacity: 0; transform: translate(800px, 22px); } }

:root:target { --scene-animation: none; }
@media (prefers-reduced-motion: reduce) { :root { --scene-animation: none; } }
</style>
  <g transform="scale(2)">
    <defs>
      <g id="cloud">
        <path d="M0 19 4 19 4 15 10 15 10 11 17 11 17 7 23 7 23 2 29 2 29 0 38 0 38 3 43 3 43 7 47 7 47 13 53 13 53 10 59 10 59 13 64 13 64 18 69 18 69 21 76 21 76 24 0 24 0 19Z" fill="#d7effa" />
        <path d="M4 18 8 18 8 14 16 14 16 17 20 17 20 10 24 10 24 5 28 5 28 2 37 2 37 5 41 5 41 10 45 10 45 17 49 17 49 19 53 19 53 15 59 15 59 18 62 18 62 21 4 21 4 18Z" fill="#f5fcff" />
        <rect x="28" y="22" width="20" height="3" fill="#d7effa" />
      </g>
      <g id="bird">
        <path d="M0 0H2V1H3V2H4V1H5V0H7V1H5V2H4V3H3V2H2V1H0Z" fill="#5684bd" />
      </g>
    </defs>
    <g class="cloud-drift">
      <use href="#cloud" x="380" y="38" />
    </g>
    <g class="cloud-drift cloud-late">
      <use href="#cloud" x="270" y="88" />
    </g>
    <g class="cloud-drift">
      <use href="#cloud" x="760" y="28" />
    </g>
    <g class="cloud-drift">
      <use href="#cloud" x="482" y="140" />
    </g>
    <g class="cloud-drift cloud-late">
      <use href="#cloud" x="793" y="97" />
    </g>
    <g class="cloud-drift">
      <use href="#cloud" x="-42" y="184" />
    </g>
    <g transform="translate(650 12)" opacity=".65">
      <g class="birds">
        <g class="wings">
          <use href="#bird" />
        </g>
      </g>
    </g>
    <g transform="translate(663 16)" opacity=".65">
      <g class="birds birds-late">
        <g class="wings">
          <use href="#bird" />
        </g>
      </g>
    </g>
    <g transform="translate(680 10)" opacity=".65">
      <g class="birds">
        <g class="wings">
          <use href="#bird" />
        </g>
      </g>
    </g>
    <g class="plane">
      <path d="M0 4H10V0H13V4H22V3H25V5H22V6H13V10H10V6H0Z" fill="#5684bd" />
      <rect x="17" y="4" width="3" height="1" fill="#f5fcff" />
    </g>
  </g>
</svg>
